<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pairing Code | VESPER-XMD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
        }

        .bot-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .bot-brand img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--accent-purple);
        }

        .bot-brand span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #a78bfa;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 0.8rem 1rem;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .code-display {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--accent-cyan);
            border-radius: 12px;
            padding: 1.2rem;
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--accent-cyan);
            text-align: center;
            margin-top: 1.5rem;
            cursor: pointer;
            position: relative;
        }

        .code-display:hover::after {
            content: 'Click to copy';
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 0.65rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #9ca3af;
            letter-spacing: 0;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="bot-brand">
                <img src="https://files.catbox.moe/xd8cvb.jpg" alt="Logo">
                <span>VESPER-XMD</span>
            </div>
            <a href="/" class="btn btn-sm btn-outline-secondary rounded-circle" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>

        <h4 class="fw-bold mb-1">Pair Code Verification</h4>
        <p class="text-secondary small mb-4">Enter your WhatsApp number including your country code (without + or spaces).</p>

        <form id="pair-form">
            <div class="mb-3">
                <label for="number" class="form-label small text-muted">Phone Number</label>
                <input type="tel" class="form-control form-control-custom" id="number" placeholder="256XXXXXXXXX" required>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">
                <i class="fa-solid fa-paper-plane me-2"></i> Get Pairing Code
            </button>
        </form>

        <div id="result-container" class="d-none">
            <div class="code-display" id="pair-code" onclick="copyCode()">
                -------
            </div>
            <p class="text-center text-muted small mt-2">Tap code to copy</p>
        </div>
    </div>

    <script>
        document.getElementById('pair-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('number').value.replace(/[^0-9]/g, '');
            const btn = document.getElementById('submit-btn');
            const resultBox = document.getElementById('result-container');
            const codeDisplay = document.getElementById('pair-code');

            if (!phone) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Requesting Code...';

            try {
                const response = await fetch(`/code?number=${phone}`);
                const data = await response.json();
                
                resultBox.classList.remove('d-none');
                if (data.code) {
                    codeDisplay.textContent = data.code;
                } else {
                    codeDisplay.textContent = 'ERROR';
                }
            } catch (err) {
                resultBox.classList.remove('d-none');
                codeDisplay.textContent = 'FAILED';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> Get Pairing Code';
            }
        });

        function copyCode() {
            const codeText = document.getElementById('pair-code').textContent.trim();
            if (codeText && codeText !== '-------' && codeText !== 'ERROR' && codeText !== 'FAILED') {
                navigator.clipboard.writeText(codeText);
                alert('Pairing code copied to clipboard!');
            }
        }
    </script>
</body>
</html>
